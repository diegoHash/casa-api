name: Deploy CASA API to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: casa-api-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out release
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install, validate, and build
        env:
          DATABASE_URL: mysql://casa:build-only@127.0.0.1:3306/casa
          SHADOW_DATABASE_URL: mysql://casa:build-only@127.0.0.1:3306/casa_shadow
        run: |
          npm ci
          npm run prisma:generate
          npm run prisma:validate
          npm run build

      - name: Package tracked source
        env:
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/casa-api-$RELEASE_ID.tar.gz" "$GITHUB_SHA"

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_KEY: ${{ secrets.EC2_KEY }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_KNOWN_HOSTS: ${{ vars.EC2_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$EC2_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$EC2_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]
          [[ -n "$EC2_KNOWN_HOSTS" ]]
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$EC2_KEY" | tr -d '\r' > "$HOME/.ssh/casa-ec2"
          chmod 600 "$HOME/.ssh/casa-ec2"
          ssh-keygen -y -P '' -f "$HOME/.ssh/casa-ec2" >/dev/null
          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh-keygen -F "$EC2_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null

      - name: Configure AWS credentials for migrations
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::066640849393:role/ec2-role-secret-reader
          aws-region: us-east-1
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"secretsmanager:GetSecretValue","Resource":"arn:aws:secretsmanager:us-east-1:066640849393:secret:casa/prod/database-migrations-IGAJrW"}]}

      - name: Apply production database migrations
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DATABASE_SECRET_ID: casa/prod/database-migrations
        run: |
          set -euo pipefail
          umask 077
          SECRET_FILE="$(mktemp)"
          TUNNEL_PID=''
          cleanup() {
            if [[ -n "$TUNNEL_PID" ]]; then kill "$TUNNEL_PID" 2>/dev/null || true; fi
            rm -f -- "$SECRET_FILE"
          }
          trap cleanup EXIT

          aws secretsmanager get-secret-value \
            --secret-id "$DATABASE_SECRET_ID" \
            --region us-east-1 \
            --query SecretString \
            --output text > "$SECRET_FILE"

          DB_HOST="$(jq -er '.host | strings | select(length > 0)' "$SECRET_FILE")"
          DB_PORT="$(jq -er '.port | tostring | select(test("^[0-9]+$"))' "$SECRET_FILE")"
          DB_USER="$(jq -er '.user_db_casa | strings | select(length > 0)' "$SECRET_FILE")"
          DB_PASSWORD="$(jq -er '.pass_db_casa | strings | select(length > 0)' "$SECRET_FILE")"
          DB_NAME="$(jq -er '.dbname | strings | select(length > 0)' "$SECRET_FILE")"
          DB_ENGINE="$(jq -er '.engine | strings' "$SECRET_FILE")"
          [[ "$DB_ENGINE" == mysql ]]
          echo "::add-mask::$DB_PASSWORD"

          ssh -i "$HOME/.ssh/casa-ec2" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=15 \
            -N -L "127.0.0.1:13306:$DB_HOST:$DB_PORT" \
            "$EC2_USER@$EC2_HOST" &
          TUNNEL_PID=$!
          for attempt in {1..20}; do
            if nc -z 127.0.0.1 13306; then break; fi
            if ! kill -0 "$TUNNEL_PID" 2>/dev/null; then
              echo 'SSH tunnel to the production database failed.' >&2
              exit 1
            fi
            sleep 1
          done
          nc -z 127.0.0.1 13306

          export DB_USER DB_PASSWORD DB_NAME
          export DATABASE_URL="$(python3 - <<'PY'
          import os
          from urllib.parse import quote
          user, password, database = (
              quote(os.environ[name], safe='')
              for name in ('DB_USER', 'DB_PASSWORD', 'DB_NAME')
          )
          print(f'mysql://{user}:{password}@127.0.0.1:13306/{database}')
          PY
          )"
          unset DB_USER DB_PASSWORD DB_NAME
          echo "::add-mask::$DATABASE_URL"
          NODE_ENV=production npm run prisma:migrate:deploy

      - name: Upload and deploy release
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          SSH=(ssh -i "$HOME/.ssh/casa-ec2" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          SCP=(scp -i "$HOME/.ssh/casa-ec2" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          REMOTE_ARCHIVE="casa/casa-api/uploads/$RELEASE_ID.tar.gz"
          "${SSH[@]}" "$EC2_USER@$EC2_HOST" "mkdir -p \"\$HOME/casa/casa-api/uploads\""
          "${SCP[@]}" "$RUNNER_TEMP/casa-api-$RELEASE_ID.tar.gz" "$EC2_USER@$EC2_HOST:~/$REMOTE_ARCHIVE"
          "${SCP[@]}" scripts/deploy-ec2.sh "$EC2_USER@$EC2_HOST:~/casa/casa-api/uploads/deploy-$RELEASE_ID.sh"
          "${SSH[@]}" "$EC2_USER@$EC2_HOST" "bash \"\$HOME/casa/casa-api/uploads/deploy-$RELEASE_ID.sh\" '$RELEASE_ID' \"\$HOME/$REMOTE_ARCHIVE\""
