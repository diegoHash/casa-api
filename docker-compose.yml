services:
  mysql:
    image: mysql:8.4
    container_name: casa-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: casa
      MYSQL_USER: casa
      MYSQL_PASSWORD: casa_local_password
      MYSQL_ROOT_PASSWORD: casa_root_local_password
      TZ: America/Caracas
    ports:
      - "3307:3306"
    volumes:
      - casa_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} -e 'SELECT 1' $${MYSQL_DATABASE} >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  casa_mysql_data:
