services:
  mysql-test:
    image: mysql:8.4
    container_name: casa-mysql-test
    environment:
      MYSQL_DATABASE: casa_test
      MYSQL_USER: casa_test
      MYSQL_PASSWORD: casa_test_password
      MYSQL_ROOT_PASSWORD: casa_test_root_password
      TZ: America/Caracas
    ports:
      - "3308:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -ucasa_test -pcasa_test_password -e 'SELECT 1' casa_test >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
